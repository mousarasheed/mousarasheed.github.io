<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mousa Rasheed</title>
<meta name="description" content="Mousa Rasheed, PhD student in mathematics at LAREMA, Université d'Angers. Singularity theory, commutative algebra, numerical semigroups.">
<style>
  :root {
    --bg: #fdfdfb;
    --text: #1f2328;
    --muted: #5b6270;
    --accent: #2a4d8f;
    --rule: #e3e1da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --text: #e6e6e3;
      --muted: #a2a8b3;
      --accent: #8fb3f0;
      --rule: #2e3238;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.6;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 16px 72px;
  }
  header { margin-bottom: 36px; display: flex; align-items: center; gap: 28px; }
  header img { width: 140px; height: 140px; object-fit: cover; border-radius: 50%; flex-shrink: 0; }
  @media (max-width: 560px) { header { flex-direction: column; align-items: flex-start; gap: 16px; } }
  h1 {
    font-size: 2.1rem;
    font-weight: normal;
    margin: 0 0 4px;
    letter-spacing: 0.01em;
  }
  .role { margin: 0; color: var(--muted); }
  .contact {
    margin-top: 14px;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 0.92rem;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h2 {
    font-size: 1.15rem;
    font-weight: normal;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 6px;
    margin: 40px 0 16px;
  }
  p { margin: 0 0 12px; }
  ul.items { list-style: none; padding: 0; margin: 0; }
  ul.items li { margin-bottom: 14px; }
  .title { font-style: italic; }
  .meta { color: var(--muted); font-size: 0.95rem; }
  .row { display: grid; grid-template-columns: 150px 1fr; gap: 4px 18px; margin-bottom: 12px; }
  .row .when { color: var(--muted); font-size: 0.95rem; }
  @media (max-width: 560px) {
    main { padding-top: 36px; }
    .row { grid-template-columns: 1fr; gap: 0; }
  }
  footer {
    margin-top: 56px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  /* Galaxy background */
  :root {
    --text: #e8e8ef;
    --muted: #a9b0c4;
    --accent: #9cc2ff;
    --rule: rgba(255,255,255,0.12);
  }
  body {
    background:
      radial-gradient(1px 1px at 10% 20%, #fff, transparent),
      radial-gradient(1px 1px at 30% 70%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 55% 15%, #fff, transparent),
      radial-gradient(1px 1px at 75% 45%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 90% 80%, #fff, transparent),
      radial-gradient(1px 1px at 45% 90%, #fff, transparent),
      radial-gradient(1px 1px at 85% 10%, #fff, transparent),
      radial-gradient(1px 1px at 20% 55%, #fff, transparent);
    background-size: 350px 350px;
    background-color: #070a17;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(120,70,200,0.35), transparent 55%),
      radial-gradient(ellipse at 85% 60%, rgba(40,90,200,0.30), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(160,60,140,0.22), transparent 60%);
  }
  main {
    background: rgba(7,10,23,0.6);
    border-radius: 14px;
    margin-top: 32px; margin-bottom: 32px;
  }
</style>
</head>
<body>
<main>

<header>
  <img src="photo.jpg" alt="Mousa Rasheed">
  <div>
  <h1>Mousa Rasheed</h1>
  <p class="role">PhD student in Mathematics, in cotutelle</p>
